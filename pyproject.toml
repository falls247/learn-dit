[project]
name = "learn-dit"
version = "0.1.0"
description = "DiT + Flow Matching 実践教材 (MNIST -> PushT)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# PushT のデータ取得とシミュレーション評価に必要。MNIST 教材だけなら不要。
pusht = [
    "lerobot>=0.1.0",
    "gym-pusht>=0.1.5",
    "gymnasium>=0.29",
    "datasets>=2.19",
]

[project.scripts]
learn-dit = "learn_dit.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learn_dit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
